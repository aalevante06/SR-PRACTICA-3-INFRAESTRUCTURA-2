# FortiGate-2174 — configuración relevante para Práctica #3 / Infraestructura #2
# Credenciales, PSK y secretos omitidos intencionalmente.

config system interface
    edit "port1"
        set ip 21.74.3.2 255.255.255.252
        set alias "WAN-ISP"
        set role wan
    next
    edit "port3"
        set ip 192.168.79.99 255.255.255.0
        set allowaccess ping https http
    next
    edit "VLAN10-USERS"
        set ip 10.21.74.1 255.255.255.128
        set interface "port2"
        set vlanid 10
    next
    edit "VPN-REMOTE-2174"
        set type tunnel
        set interface "port1"
    next
    edit "VLAN20-JUMP"
        set ip 10.21.75.1 255.255.255.248
        set interface "port2"
        set vlanid 20
    next
    edit "VLAN30-WEB"
        set ip 10.21.75.9 255.255.255.248
        set interface "port2"
        set vlanid 30
    next
end

config system dhcp server
    edit 2
        set default-gateway 10.21.74.1
        set netmask 255.255.255.128
        set interface "VLAN10-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.74.10
                set end-ip 10.21.74.100
            next
        end
        config reserved-address
            edit 1
                set ip 10.21.74.11
                set mac 0c:bb:f1:bb:00:00
            next
            edit 2
                set ip 10.21.74.10
                set mac 0c:d9:bd:9b:00:00
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
end

config firewall address
    edit "VPN-REMOTE-2174_range"
        set type iprange
        set start-ip 10.212.135.10
        set end-ip 10.212.135.20
    next
    edit "USER-SIN-PRIV"
        set associated-interface "VLAN10-USERS"
        set subnet 10.21.74.10 255.255.255.255
    next
    edit "USER-PRIV"
        set associated-interface "VLAN10-USERS"
        set subnet 10.21.74.11 255.255.255.255
    next
    edit "JUMP-SERVER"
        set associated-interface "VLAN20-JUMP"
        set subnet 10.21.75.2 255.255.255.255
    next
    edit "WEB-SERVER"
        set associated-interface "VLAN30-WEB"
        set subnet 10.21.75.10 255.255.255.255
    next
end

config firewall addrgrp
    edit "VPN-REMOTE-2174_split"
        set member "JUMP-SERVER"
    next
end

config user local
    edit "vpn2174"
        set type password
        set passwd <REDACTED>
    next
end

config user group
    edit "SSLVPN-USER-2174"
        set member "vpn2174"
    next
end

config vpn ipsec phase1-interface
    edit "VPN-REMOTE-2174"
        set type dynamic
        set interface "port1"
        set mode aggressive
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set dhgrp 5
        set xauthtype auto
        set authusrgrp "SSLVPN-USER-2174"
        set nattraversal forced
        set ipv4-start-ip 10.212.135.10
        set ipv4-end-ip 10.212.135.20
        set ipv4-netmask 255.255.255.0
        set dns-mode auto
        set ipv4-split-include "VPN-REMOTE-2174_split"
        set save-password enable
        set psksecret <REDACTED>
    next
end

config vpn ipsec phase2-interface
    edit "VPN-REMOTE-2174"
        set phase1name "VPN-REMOTE-2174"
        set proposal des-md5 des-sha1
        set dhgrp 5
    next
end

config firewall policy
    edit 1
        set name "USER-TO-INTERNET"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 5
        set name "JUMP-TO-WEB-ALLOWED"
        set srcintf "VLAN20-JUMP"
        set dstintf "VLAN30-WEB"
        set action accept
        set srcaddr "JUMP-SERVER"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "HTTPS" "RDP" "SSH"
        set logtraffic all
    next
    edit 4
        set name "USER1-DENY-SSH-JUMP"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-JUMP"
        set srcaddr "USER-SIN-PRIV"
        set dstaddr "JUMP-SERVER"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 7
        set name "USER1-DENY-SSH-WEB"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN30-WEB"
        set srcaddr "USER-SIN-PRIV"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 8
        set name "USER1-WEB-TO-JUMP"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-JUMP"
        set action accept
        set srcaddr "USER-SIN-PRIV"
        set dstaddr "JUMP-SERVER"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 9
        set name "USER2-TO-JUMP"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-JUMP"
        set action accept
        set srcaddr "USER-PRIV"
        set dstaddr "JUMP-SERVER"
        set schedule "always"
        set service "HTTPS" "RDP"
        set logtraffic all
    next
    edit 10
        set name "USER2-DENY-DIRECT-WEB"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN30-WEB"
        set srcaddr "USER-PRIV"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 11
        set name "VPN-TO-JUMP"
        set srcintf "VPN-REMOTE-2174"
        set dstintf "VLAN20-JUMP"
        set action accept
        set srcaddr "VPN-REMOTE-2174_range"
        set dstaddr "JUMP-SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 12
        set name "VPN-DENY-DIRECT-WEB"
        set srcintf "VPN-REMOTE-2174"
        set dstintf "VLAN30-WEB"
        set srcaddr "VPN-REMOTE-2174_range"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 13
        set name "JUMP-DNS-INTERNET"
        set srcintf "VLAN20-JUMP"
        set dstintf "port1"
        set action accept
        set srcaddr "JUMP-SERVER"
        set dstaddr "all"
        set schedule "always"
        set service "DNS"
        set logtraffic all
        set nat enable
    next
end

config router static
    edit 1
        set gateway 21.74.3.1
        set device "port1"
    next
end
